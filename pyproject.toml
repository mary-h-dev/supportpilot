[project]
name = "supportpilot"
version = "0.1.0"
description = "AI support-ticket assistant with human approval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "structlog>=24.1",
  "httpx>=0.27",
  "openai>=1.40",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "mcp>=1.20,<2",  # v2 renamed the API (FastMCP -> MCPServer); pinned on purpose
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportpilot"]
